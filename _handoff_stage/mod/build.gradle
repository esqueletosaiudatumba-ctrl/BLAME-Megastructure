plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
    id 'com.gradleup.shadow' version '9.6.1'
}

apply from: 'gradle/scripts/dependencies.gradle'

group = 'blame'
version = '1.0.0'
base.archivesName = 'blamegen'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// RFG 2.x: the MC version is a single property on the extension; mappings come from
// gradle.properties (mapping_channel / mapping_version).
minecraft {
    version = '1.12.2'
}

// Interpolate the ${mod_*} / ${mod_version} placeholders used by mcmod.info and pack.mcmeta,
// so the built jar carries literal values instead of unresolved placeholders.
processResources {
    def p = { String k -> project.findProperty(k) ?: '' }
    inputs.property 'version', version
    inputs.property 'mod_id', p('mod_id')
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        filter(org.apache.tools.ant.filters.ReplaceTokens,
                tokens: [
                        mod_id         : 'blamegen',
                        mod_name       : 'BLAME Megastructure Generator',
                        mod_version    : version,
                        mod_description: p('mod_description'),
                        mod_authors    : p('mod_authors'),
                        mod_credits    : p('mod_credits'),
                        mod_url        : p('mod_url'),
                        mod_update_json: p('mod_update_json'),
                        mod_logo_path  : p('mod_logo_path')
                ],
                beginToken: '${', endToken: '}')
    }
}

jar {
    manifest {
        attributes(['FMLCorePluginContainsFMLMod': 'true'])
    }
}
