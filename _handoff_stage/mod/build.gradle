plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
    id 'com.gradleup.shadow' version '9.6.1'
}

apply from: 'gradle/scripts/dependencies.gradle'

group = 'blame'
version = '1.0.0'
base.archivesName = 'blamegen'

// Forge 1.12.2 runs on Java 8 (the instance uses jre-legacy). Compiling on a newer toolchain
// would emit class files the game cannot load. Gradle itself still runs on JDK 17+.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

// RFG defaults to Minecraft 1.7.10 (Forge package cpw.mods.fml, Twitch, WorldSettings.GameType...).
// The property that selects 1.12.2 is `mcVersion`; `version = ...` silently set project.version
// instead, which is why compilePatchedMcJava was compiling 1.7.10 sources and failing.
minecraft {
    mcVersion = '1.12.2'
}

// Interpolate the ${mod_*} / ${mod_version} placeholders used by mcmod.info and pack.mcmeta,
// so the built jar carries literal values instead of unresolved placeholders.
processResources {
    def p = { String k -> project.findProperty(k) ?: '' }
    inputs.property 'version', version
    inputs.property 'mod_id', p('mod_id')
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        filter(org.apache.tools.ant.filters.ReplaceTokens,
                tokens: [
                        mod_id         : 'blamegen',
                        mod_name       : 'BLAME Megastructure Generator',
                        mod_version    : version,
                        mod_description: p('mod_description'),
                        mod_authors    : p('mod_authors'),
                        mod_credits    : p('mod_credits'),
                        mod_url        : p('mod_url'),
                        mod_update_json: p('mod_update_json'),
                        mod_logo_path  : p('mod_logo_path')
                ],
                beginToken: '${', endToken: '}')
    }
}

jar {
    manifest {
        attributes(['FMLCorePluginContainsFMLMod': 'true'])
    }
}
