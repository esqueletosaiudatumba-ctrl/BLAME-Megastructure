name: Diagnose BLAME mod build

on:
  push:
    branches: ["build/diagnose-rfg"]
    paths:
      - "mod/**"
      - ".github/workflows/build-blamegen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build mod
        working-directory: mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain --stacktrace
      - name: Upload generated mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blamegen-1.0.0
          path: mod/build/libs/blamegen-*.jar
          if-no-files-found: error
