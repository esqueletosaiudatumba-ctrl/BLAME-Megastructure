name: Build BLAME mod

on:
  push:
    branches: [master]
    paths:
      - "mod/**"
      - "tools/preview/**"
      - "tools/verify/**"
      - "docs/TOHA_MONUMENT_DESIGN.md"
      - "GRAND_GOAL_VISION.md"
      - ".github/workflows/build-blamegen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Offline generator compile and verification
        run: |
          mkdir -p build/pv
          javac -nowarn -d build/pv mod/src/main/java/blame/blamegen/core/*.java tools/preview/*.java tools/verify/*.java
          java -cp build/pv blame.blamegen.core.TohaMonumentCheck
          java -cp build/pv blame.blamegen.core.Probe
          java -cp build/pv blame.blamegen.core.SeamCheck
          java -cp build/pv blame.blamegen.core.Survey
          java -cp build/pv blame.blamegen.core.LandmarkSurvey
          java -cp build/pv Preview bench 3000

      - name: Render isolated Toha monument views
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # Wide hero and orthographic reference views retained from the original preview pass.
          timeout 75s java -Xmx1400m -cp build/pv Preview toha-persp toha-monument.png 0 800 1000 180 -3 65 960 540 7000
          echo "wide silhouette render exit=$?"
          timeout 60s java -Xmx1400m -cp build/pv Preview toha-persp toha-inscription.png 2400 355 -2500 135 0 55 960 540 1800
          echo "hull inscription close-up exit=$?"
          timeout 100s java -Xmx2g -cp build/pv Preview toha-section toha-cross-section.png -4603 0 1030 5000 2200 5
          echo "central cut render exit=$?"
          timeout 60s java -Xmx2g -cp build/pv Preview toha-section toha-elevation.png -3259 0 1030 4400 2100 4
          echo "front section render exit=$?"
          timeout 70s java -Xmx2g -cp build/pv Preview toha-elevation toha-front-elevation.png 0 1030 4400 2100 4
          echo "tier-aware front elevation exit=$?"
          timeout 100s java -Xmx2g -cp build/pv Preview toha-slice toha-plan.png 800 0 -4608 6500 8
          echo "mid-level plan exit=$?"

          # Exterior perspectives: rear, flanks, corners, low arrival, upper crown and service mast.
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-south-low-angle.png 0 92 -1400 180 -14 65 640 360 4200
          echo "south low angle exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-gate-close.png 0 280 -1720 180 -3 58 640 360 3200
          echo "gate close-up exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-east-flank.png 3000 760 -4000 102 0 70 640 360 4300
          echo "east flank exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-west-flank.png -3000 760 -4000 258 0 70 640 360 4300
          echo "west flank exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-southeast-oblique.png 3000 800 -1800 133 -7 66 640 360 4800
          echo "southeast oblique exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-southwest-oblique.png -3000 800 -1800 227 -7 66 640 360 4800
          echo "southwest oblique exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-northwest-oblique.png -2600 700 -6500 306 -5 66 640 360 4200
          echo "northwest oblique exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-north-rear.png 0 950 -7500 0 2 66 640 360 4200
          echo "north rear exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-high-overlook.png 3500 1900 -1800 129 14 68 640 360 7000
          echo "high overlook exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-crown-south.png 0 1640 -1700 180 -5 55 640 360 3000
          echo "crown south exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-mast-east.png 2900 1450 -5200 110 -8 65 640 360 2800
          echo "mast detail exit=$?"
          timeout 45s java -Xmx1200m -cp build/pv Preview toha-persp toha-transfer-mass.png 3200 800 -4100 121 -4 60 640 360 3000
          echo "transfer mass exit=$?"

          # Interior views: the gravity furnace, nave, chamber machines and new maintenance stair.
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-furnace-view.png 0 650 -4508 180 0 72 640 360 1900
          echo "furnace from nave exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-furnace-upward.png 0 760 -5030 180 -32 68 640 360 2200
          echo "furnace upward exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-nave-east.png 900 820 -4700 118 1 70 640 360 1900
          echo "east nave exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-service-stair.png 900 610 -4700 119 0 70 640 360 1000
          echo "service stair exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-main-ai-chamber.png 0 380 -3108 0 0 70 640 360 1300
          echo "main AI chamber exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-upper-ai-chamber.png -340 820 -3300 0 0 68 640 360 1300
          echo "upper AI chamber exit=$?"

          # Orbital-gallery and material-detail shots.
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-gallery-front.png 1000 550 -1650 180 -2 65 640 360 2400
          echo "front orbital gallery exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-gallery-west.png -3100 950 -4300 225 -3 65 640 360 2300
          echo "west orbital gallery exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-gallery-east.png 3100 950 -4300 135 -3 65 640 360 2300
          echo "east orbital gallery exit=$?"
          timeout 40s java -Xmx1200m -cp build/pv Preview toha-persp toha-hull-detail.png 2380 320 -2700 136 0 55 640 360 1600
          echo "hull detail exit=$?"

          # Plans at five elevations reveal how the hollow hull and broken rings change with height.
          timeout 60s java -Xmx1500m -cp build/pv Preview toha-slice toha-plan-foundation.png 55 0 -4608 6500 10
          echo "foundation plan exit=$?"
          timeout 60s java -Xmx1500m -cp build/pv Preview toha-slice toha-plan-lower.png 480 0 -4608 6500 10
          echo "lower gallery plan exit=$?"
          timeout 60s java -Xmx1500m -cp build/pv Preview toha-slice toha-plan-middle.png 950 0 -4608 6500 10
          echo "middle gallery plan exit=$?"
          timeout 60s java -Xmx1500m -cp build/pv Preview toha-slice toha-plan-upper.png 1500 0 -4608 6500 10
          echo "upper gallery plan exit=$?"
          timeout 60s java -Xmx1500m -cp build/pv Preview toha-slice toha-plan-crown.png 1900 0 -4608 6500 10
          echo "crown plan exit=$?"

          # Additional sections and elevations isolate the chamber openings and hull profile.
          timeout 70s java -Xmx1500m -cp build/pv Preview toha-section toha-section-furnace.png -5168 0 1030 5000 2200 6
          echo "furnace section exit=$?"
          timeout 70s java -Xmx1500m -cp build/pv Preview toha-section toha-section-nave.png -4408 0 1030 5000 2200 6
          echo "nave section exit=$?"
          timeout 70s java -Xmx1500m -cp build/pv Preview toha-section toha-section-rear.png -6408 0 1030 5000 2200 6
          echo "rear wall section exit=$?"
          timeout 70s java -Xmx1500m -cp build/pv Preview toha-elevation toha-lower-facade.png 0 430 4600 900 4
          echo "lower facade elevation exit=$?"
          timeout 70s java -Xmx1500m -cp build/pv Preview toha-elevation toha-upper-facade.png 0 1540 3600 980 4
          echo "upper facade elevation exit=$?"

          # One labeled sheet lets the full collection be scanned quickly.
          java -Djava.awt.headless=true -cp build/pv ContactSheet toha-contact-sheet.png toha-*.png
          echo "contact sheet exit=$?"
          cat > TOHA_PREVIEWS_README.md <<'EOF'
          # Toha Heavy Industries — preview collection

          These are offline schematic renders generated from the committed Java monument source.
          They are not Minecraft screenshots; in-game lighting, block faces and traversal may differ.

          - Perspectives: exterior silhouettes, approach, rear and side profiles, high overlook,
            hull inscription, exterior machinery and broken orbital galleries.
          - Interior perspectives: gravity furnace, nave, AI chambers and the new service stair.
          - Plans: horizontal slices through the foundation, lower/middle/upper gallery tiers and crown.
          - Sections/elevations: internal nave/furnace cutaways and tier-aware front facade projections.
          - toha-contact-sheet.png is the labeled overview. Open individual PNGs for full resolution.
          EOF

      - name: Upload Toha monument views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toha-monument-preview
          path: |
            toha-*.png
            TOHA_PREVIEWS_README.md
          if-no-files-found: warn

      - name: Build mod
        working-directory: mod
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log
      - name: Install built generator in instance package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # RFG emits both the dev jar and the reobfuscated runtime jar. Never
          # alphabetically select -dev.jar and rename it to the shipping filename.
          jar="mod/build/libs/blamegen-1.0.0.jar"
          if [ ! -f "$jar" ]; then
            jar="$(find mod/build/libs -maxdepth 1 -type f -name 'blamegen-*.jar' ! -name '*-dev.jar' ! -name '*sources*' ! -name '*javadoc*' | sort | head -n 1)"
          fi
          test -f "$jar" || { echo "No non-dev blamegen runtime JAR found"; exit 1; }
          case "$(basename "$jar")" in *-dev.jar) echo "Refusing to ship a dev JAR"; exit 1;; esac
          unzip -t "$jar" >/dev/null
          jar tf "$jar" | grep -qx 'blame/blamegen/BlameGen.class' || { echo "Runtime JAR is missing BlameGen.class"; exit 1; }
          jar tf "$jar" | grep -qx 'mcmod.info' || { echo "Runtime JAR is missing mcmod.info"; exit 1; }
          echo "Selected runtime JAR: $jar ($(stat -c%s "$jar") bytes)"
          sha256sum "$jar"
          cp "$jar" /tmp/blamegen-built.jar
          git fetch origin master
          if ! git diff --quiet "$GITHUB_SHA" origin/master -- mod tools/verify/TohaMonumentCheck.java; then
            echo "Master has newer generator or monument-test sources; skipping this stale JAR."
            exit 0
          fi
          git checkout -B publish-instance origin/master
          install -D /tmp/blamegen-built.jar instance-pkg/minecraft/mods/blamegen-1.0.0.jar
          install -D GRAND_GOAL_VISION.md instance-pkg/GRAND_GOAL_VISION.md
          install -D docs/TOHA_MONUMENT_DESIGN.md instance-pkg/docs/TOHA_MONUMENT_DESIGN.md

          # A GITHUB_TOKEN push does not start another Actions workflow. Rebuild
          # the deterministic importable ZIP in this job alongside the JAR so
          # the released instance can never lag the source that was just built.
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED, ZipInfo

          root = Path("instance-pkg")
          out = Path("BLAME_Megastructure_Instance.zip")
          required = [
              root / "README.txt",
              root / "instance.cfg",
              root / "mmc-pack.json",
              root / "GRAND_GOAL_VISION.md",
              root / "docs/TOHA_MONUMENT_DESIGN.md",
              root / "minecraft/config/cubicchunks.cfg",
              root / "minecraft/mods/CubicChunks-1.12.2-0.0.1301.0-SNAPSHOT-all.jar",
              root / "minecraft/mods/blamegen-1.0.0.jar",
              root / "minecraft/saves/BLAME_Infinite_Megastructure/level.dat",
              root / "docs/reference-images/ref-01-megastructure-surf.jpg",
              root / "docs/reference-images/ref-02-domestic-scale.jpg",
              root / "docs/reference-images/ref-03-cyan-verticality.jpg",
              root / "docs/reference-images/ref-04-industrial-machinery.jpg",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing required package files: " + ", ".join(missing))
          with ZipFile(out, "w", compression=ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  rel = path.relative_to(root).as_posix()
                  info = ZipInfo(rel, date_time=(2026, 10, 11, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          with ZipFile(out, "r") as z:
              names = set(z.namelist())
              assert "minecraft/mods/blamegen-1.0.0.jar" in names
              assert "GRAND_GOAL_VISION.md" in names
              assert "docs/TOHA_MONUMENT_DESIGN.md" in names
              assert all(f"docs/reference-images/ref-0{i}-" in "\n".join(names) for i in range(1, 5))
              assert z.testzip() is None
          print(f"Created {out} ({out.stat().st_size} bytes, {len(names)} files)")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instance-pkg/minecraft/mods/blamegen-1.0.0.jar instance-pkg/GRAND_GOAL_VISION.md instance-pkg/docs/TOHA_MONUMENT_DESIGN.md BLAME_Megastructure_Instance.zip
          if git diff --cached --quiet; then
            echo "The instance jar and ZIP are already current."
          else
            git commit -m "instance: ship verified authored Toha monument"
            git push origin HEAD:master
          fi

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          tail -c 60000 build.log > /tmp/build-tail.log || echo "no log" > /tmp/build-tail.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/jar && cp mod/build/libs/blamegen-*.jar /tmp/jar/ 2>/dev/null || true
          git checkout --orphan ci-logs
          git rm -rf . -q
          cp /tmp/build-tail.log build-tail.log
          cp /tmp/jar/*.jar . 2>/dev/null || true
          git add build-tail.log
          if compgen -G "*.jar" > /dev/null; then git add *.jar; fi
          git commit -q -m "ci: build log for ${GITHUB_SHA}"
          git push -f origin ci-logs
      - name: Upload generated mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blamegen-1.0.0
          path: mod/build/libs/blamegen-1.0.0.jar
          if-no-files-found: error
